version: "3.8"

services:
  react-vite-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.aidr.io.vn}
        VITE_SIGNALR_URL: ${VITE_SIGNALR_URL:-https://api.aidr.io.vn/hubs/realtime}
        VITE_CHAT_SOCKET_URL: ${VITE_CHAT_SOCKET_URL:-wss://api.aidr.io.vn/chat}
    image: react-vite-app:production
    container_name: react-vite-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
